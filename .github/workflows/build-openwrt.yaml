name: Build OpenWrt for GL-MT6000

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
  schedule:
    - cron: "38 1 */3 * *"

env:
  REMOTE_REPOSITORY: pesa1234/openwrt
  CONFIG_FILE: mt6000.config
  GH_TOKEN: ${{ github.token }}

jobs:
  check_commits:
    name: Check for new commits
    runs-on: ubuntu-latest
    outputs:
      remote_branch: ${{ steps.check_commits.outputs.remote_branch }}
      release_prefix: ${{ steps.check_commits.outputs.release_prefix }}
      new_commits: ${{ steps.check_commits.outputs.new_commits }}
      latest_commit_sha: ${{ steps.check_commits.outputs.latest_commit_sha }}
    steps:
      - name: Check for new commits in pesa1234 repo
        id: check_commits
        run: |
          remote_branch=$(git ls-remote https://github.com/${{ env.REMOTE_REPOSITORY }}.git "refs/heads/next-*" | sed -e 's|\(.*heads/\)||' | grep -viE 'test|beta' | sort -V | tail -n1)
          [ -n "$remote_branch" ] && latest_commit_sha=$(gh api "repos/${{ env.REMOTE_REPOSITORY }}/commits/${remote_branch}" --jq .sha)
          [ -z "$latest_commit_sha" ] && { echo "*** COULD NOT GET latest_commit_sha FROM remote_branch=$remote_branch ***" ; exit 1; }
          gh api "repos/${{ github.repository }}/releases/latest" --jq .body 2>/dev/null | grep -q "${latest_commit_sha}" && echo "new_commits=false" >> $GITHUB_OUTPUT || echo "new_commits=true" >> $GITHUB_OUTPUT
          echo "remote_branch=${remote_branch}"
          echo "release_prefix=${remote_branch%.rss*}"
          echo "latest_commit_sha=$latest_commit_sha"
          echo "remote_branch=${remote_branch}" >> $GITHUB_OUTPUT
          echo "release_prefix=${remote_branch%.rss*}" >> $GITHUB_OUTPUT
          echo "latest_commit_sha=$latest_commit_sha" >> $GITHUB_OUTPUT

  build:
    name: Build OpenWrt
    needs: check_commits
    if: github.event_name == 'workflow_dispatch' || needs.check_commits.outputs.new_commits == 'true'
    runs-on: [self-hosted, gl-mt6000]
    env:
      CCACHE_DIR: /runner/_work/.ccache
    steps:
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gettext libncurses-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget llvm ccache
          sudo apt autoremove -y && sudo apt clean -y

      - name: Setup Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          check-latest: true

      - name: Checkout remote repository
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.REMOTE_REPOSITORY }}
          ref: ${{ needs.check_commits.outputs.remote_branch }}

      - name: Checkout current repository
        uses: actions/checkout@v7.0.1
        with:
          path: "builder_repo"

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          # run again because sometimes it misses some dependencies
          ./scripts/feeds install -a

      - name: Setup configuration and custom files
        run: |
          # delete unneeded folders and patch files with repository info
          rm -frv builder_repo/.git builder_repo/.github
          for file in $(grep -rl XXXXXX builder_repo/); do echo "Patching: $file"; sed -i 's|XXXXXX/YYYYYY|${{ github.repository }}|g' "$file" || exit 1; done
          patch -p1 < builder_repo/attendedsysupgrade-with-GitHub.patch
          mv -v builder_repo/files ./
          # Mark every shipped executable 755
          for d in files/usr/bin files/usr/sbin files/etc/init.d files/www/cgi-bin; do
            [ -d "$d" ] || continue
            find "$d" -type f -exec chmod -v 755 {} +
          done
          # Copy custom repository packages into buildroot
          if [ -d builder_repo/package ]; then
            mkdir -p package
            cp -rfv builder_repo/package/* package/
          fi
          # Clone Proton2025 theme
          git clone --depth=1 https://github.com/ChesterGoodiny/luci-theme-proton2025.git package/luci-theme-proton2025
          mv -v builder_repo/${{ env.CONFIG_FILE }} .config
          rm -rfv builder_repo
          # Configure OpenWrt to use runner's Go 1.24 to bootstrap Go 1.27
          echo "Using runner Go: $(go version) at $(go env GOROOT)"
          sed -i '/CONFIG_GOLANG_BUILD_BOOTSTRAP/d' .config
          sed -i '/CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT/d' .config
          echo '# CONFIG_GOLANG_BUILD_BOOTSTRAP is not set' >> .config
          echo "CONFIG_GOLANG_EXTERNAL_BOOTSTRAP_ROOT=\"$(go env GOROOT)\"" >> .config
          # Configure ccache and persistent download directory on runner NVMe
          mkdir -p /runner/_work/.ccache /runner/_work/dl
          ccache -M 25G
          sed -i '/CONFIG_CCACHE_DIR/d' .config
          sed -i '/CONFIG_DOWNLOAD_FOLDER/d' .config
          echo 'CONFIG_CCACHE_DIR="/runner/_work/.ccache"' >> .config
          echo 'CONFIG_DOWNLOAD_FOLDER="/runner/_work/dl"' >> .config
          make defconfig

      - name: Build firmware
        run: |
          ccache -s
          make download -j$(nproc) || {
            echo "Retrying..."
            sleep 60
            make download -j1 V=s
          }
          make -j$(nproc) || {
            echo "Retrying..."
            sleep 60
            make -j1 V=s
          }
          ccache -s
          mkdir -p firmware
          find ./bin -type f \( -iname 'openwrt-*-sysupgrade.bin' -or -iname 'openwrt-*-factory.bin' -or -iname 'config.buildinfo' -or -iname 'version.buildinfo' \) -exec mv -v {} ./firmware/ \; ||:
          mv .config firmware/full.config ||:
          cd firmware && sha256sum openwrt-* >sha256sums ||:

      - name: Upload artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: gl-mt6000-firmware
          path: firmware/*

      - name: Create release
        run: |
          RELEASE_DATE=$(date +%F)
          gh release delete "${{ needs.check_commits.outputs.release_prefix }}-${RELEASE_DATE}" --cleanup-tag -y --repo "${{ github.repository }}" ||:
          cat << 'EOF' | sed 's/^          //' > release_notes.md
          ### 🔄 Upstream Source
          - **Repository:** [${{ env.REMOTE_REPOSITORY }}](https://github.com/${{ env.REMOTE_REPOSITORY }})
          - **Branch:** ${{ needs.check_commits.outputs.remote_branch }}
          - **Commit:** [${{ needs.check_commits.outputs.latest_commit_sha }}](https://github.com/${{ env.REMOTE_REPOSITORY }}/tree/${{ needs.check_commits.outputs.latest_commit_sha }})

          ### 📝 Build Information
          - **Target:** [GL.iNet Flint 2 (GL-MT6000)](https://openwrt.org/toh/gl.inet/gl-mt6000)
          - **Configuration:** [${{ env.CONFIG_FILE }}](${{ env.CONFIG_FILE }})

          ### 📦 Features & Packages Included
          * **Containers & Virtualization:** Docker CE, dockerd, docker-compose, and LuCI Dockerman (`luci-app-dockerman`).
          * **Storage & File Sharing:**
            - USB 3.0 / UAS high-speed storage drivers (`kmod-usb-storage`, `kmod-usb-storage-uas`, `block-mount`).
            - Filesystems: Btrfs (`kmod-fs-btrfs`, `btrfs-progs`), ext4 (`e2fsprogs`), FAT/FAT32 (`dosfstools`), exFAT (`kmod-fs-exfat`), NTFS (`kmod-fs-ntfs3`).
            - Windows Network Shares: Samba 4 (`samba4-server`, `luci-app-samba4`).
            - Web File Explorer: `luci-app-filebrowser`.
            - Media Server: miniDLNA (`luci-app-minidlna`, `minidlna`).
            - Disk Power Management: `luci-app-hd-idle` (auto spindown for external HDDs).
          * **VPN & Remote Networking:**
            - Tailscale mesh VPN (`tailscale`, `luci-app-tailscale-community`).
            - ZeroTier SDN (`zerotier`).
            - RustDesk self-hosted remote desktop server (`rustdesk-server`, `luci-app-rustdesk-server`) with dormant port forwards.
            - WireGuard (`luci-proto-wireguard`) & Policy Based Routing (`luci-app-pbr`).
            - Optional NordVPN Lite installer script (`nordvpnlite-install`).
          * **Security, Adblocking & Firewall:**
            - IP Threat Blocker: banIP nftables sets (`banip`, `luci-app-banip`).
            - DNS Adblocker & Sinkhole: AdGuard Home (`adguardhome`, `luci-app-adguardhome`).
            - Fast DNS Blocker: AdBlock Fast (`adblock-fast`, `luci-app-adblock-fast`).
            - Port Mapping & Discovery: UPnP (`miniupnpd-nftables`, `luci-app-upnp`), mDNS (`avahi-dbus-daemon`).
          * **Encrypted DNS (DoH / DoT):**
            - Official DoH Proxy: HTTPS DNS Proxy for IPv4/IPv6 (`https-dns-proxy`, `luci-app-https-dns-proxy`).
            - Smart Multi-Upstream Resolver: SmartDNS DoH/DoT (`smartdns`, `luci-app-smartdns`).
          * **Traffic & Multi-WAN Management:**
            - Bufferbloat Mitigation: SQM QoS with CAKE (`sqm-scripts`, `luci-app-sqm`).
            - Multi-WAN Balancing: mwan3 failover & load balancing (`mwan3`, `luci-app-mwan3`).
            - Core QoS: CAKE schedulers (`kmod-sched-cake`, `tc-tiny`).
          * **Wireless & Roaming Optimization:**
            - AP Roaming & Band Steering: usteer 802.11k/v/r assist (`usteer`, `luci-app-usteer`).
            - Full WPA3/802.11r/k/v suite: `wpad-openssl` with fast WiFi UCODE scripts.
          * **Administration & Monitoring:**
            - Modern LuCI Dashboard: `luci-mod-dashboard` with custom hardware temperature monitoring (CPU SoC, MT7915 Wi-Fi 2.4G/5G, RTL8221B WAN/LAN 2.5G PHYs), live multi-series chart, KPI cards, and detail tab.
            - Status Overview Thermals: Hardware temperature overview table on classic LuCI Status page.
            - Web Terminal: `luci-app-ttyd` (browser SSH/terminal tab in LuCI).
            - Dynamic DNS: `luci-app-ddns` (`ddns-scripts`).
            - Speed Test: `luci-app-librespeed` (embedded speedtest tool).
            - Wi-Fi Association Log: `luci-app-wifihistory` (client roam and connection tracking).
            - Security & Auth: `luci-plugin-2fa` (Two-Factor Authentication for LuCI).
            - Bandwidth Monitor: `luci-app-nlbwmon` (per-host traffic accounting).
            - Extended System Statistics: `luci-app-statistics` with full collectd plugin suite (`cpufreq`, `disk`, `dns`, `df`, `dhcpleases`, `ethstat`, `ntpd`, `processes`, `protocols`, `sensors`, `sqm`, `swap`, `thermal`, `threshold`, `uptime`, `vmem`).
            - Network Tools: Wake-on-LAN (`luci-app-wol`).
            - Shell & System: GNU Bash (`bash`), `coreutils-whoami`, persistent terminal command history, kernel swap support enabled.
          * **Modern Themes:**
            - Proton2025 (`luci-theme-proton2025` set as default on first boot) with dark mode, custom accent, constellation animation, and integrated theme settings.
            - Material (`luci-theme-material`), OpenWrt (`luci-theme-openwrt`), and OpenWrt 2020 (`luci-theme-openwrt-2020`).

          ### ✂️ Removals & Optimizations
          * odhcp replaced by unified `dnsmasq-full`.
          * Legacy iptables replaced by modern `nftables`.
          * Kernel debug symbols stripped for compact size and performance.
          EOF
          gh release create "${{ needs.check_commits.outputs.release_prefix }}-${RELEASE_DATE}" --repo "${{ github.repository }}" --latest --notes-file release_notes.md --title "OpenWrt Custom Release for Flint 2 (${{ needs.check_commits.outputs.release_prefix }}-${RELEASE_DATE})" firmware/*

      - name: Clean up old releases
        run: |
          # '.[0:10][]' limits to the 10 most recent releases
          gh api repos/${{ github.repository }}/releases | jq -r '.[10:][] | "\(.id) \(.tag_name)"' | while read id tag; do
            gh api -X DELETE "repos/${{ github.repository }}/releases/$id" && gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" 2>/dev/null ||:
          done
